[package]
name = "regol-cli"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["science::geo", "command-line-utilities"]
readme = "README.md"
include = ["/src/**", "/tests/**", "/LICENSE", "/README.md"]
description = "Build, query, inspect, and export GeoDesk GOL 2.0 files"

[[bin]]
name = "regol"
path = "src/main.rs"

[dependencies]
geo = { version = "0.31", default-features = false }
miniz_oxide = { version = "0.9.1", features = ["simd"] }
rayon = "1"
regol = { version = "0.2.0", path = "..", default-features = false, features = ["mmap", "build", "parallel", "http"] }
itoa = "1"
rustc-hash = "2"
serde_json = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
