[package]
name = "regol-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
regol = { path = "..", default-features = false }

[[bin]]
name = "read_gol"
path = "fuzz_targets/read_gol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "query"
path = "fuzz_targets/query.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
