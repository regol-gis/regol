name: Fuzz
on: workflow_dispatch

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run fuzz targets
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
          mkdir -p fuzz/corpus/read_gol
          cp tests/fixtures/*.gol fuzz/corpus/read_gol/
          cargo +nightly fuzz run read_gol -- -max_total_time=60 -rss_limit_mb=1024 -max_len=262144
          cargo +nightly fuzz run query -- -max_total_time=30 -max_len=4096
