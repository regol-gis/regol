name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Verify release version
        id: version
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version=$(python3 tools/release.py --check --tag "$GITHUB_REF_NAME")
            git merge-base --is-ancestor HEAD refs/remotes/origin/main
          else
            version=$(python3 tools/release.py --check)
          fi
          echo "number=$version" >> "$GITHUB_OUTPUT"
      - name: Test library, builder and CLI
        run: |
          cargo test --locked --workspace --all-features --lib --bins --tests
          cargo test --locked --workspace --all-features --doc
      - name: Build and smoke-test release assets
        run: python3 tools/release.py
      - name: Upload rehearsal artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: regol-release-rehearsal
          path: target/dist/v${{ steps.version.outputs.number }}/
          if-no-files-found: error
      - name: Publish tagged release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          version="${{ steps.version.outputs.number }}"
          flags=(
            --title "regol $version"
            --notes-file "docs/releases/${version}.md"
          )
          if [[ "$version" == *-rc.* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" target/dist/v${version}/*
