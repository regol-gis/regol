version: 2
updates:
  - package-ecosystem: cargo
    # The root workspace includes cli. The fuzz harness has its own lockfile.
    directories:
      - /
      - /fuzz
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
